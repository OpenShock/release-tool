on:
  push:
    branches: [master]
    paths-ignore:
      - 'CHANGELOG.md'
      - '.changes/**'
  workflow_dispatch:
    inputs:
      version:
        description: Release this version instead of the computed one (e.g. 1.0.1)
        required: false
        default: ''

name: release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Releases are only cut from master, including manual dispatches. The
    # release commit is pushed by the App, so skip it by message, not actor.
    if: >-
      github.ref_name == 'master' &&
      !startsWith(github.event.head_commit.message, 'chore: release ')

    steps:
      # Push and publish with a short-lived token from the release GitHub App;
      # unlike GITHUB_TOKEN, its pushes trigger CI on the release commit.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase on top of latest remote
        run: git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Run release tool
        id: meta
        uses: ./
        with:
          mode: release
          notes-output: release-notes.md
          version: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Push commit and tag
        uses: OpenShock/actions/publish-tag@21ca2d511bca92cf24fb502fa302f82700822584 # v1.1.1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          atomic: 'true'

      - name: Build release binaries
        if: steps.meta.outputs.tag != ''
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${platform%/*}" GOARCH="${platform#*/}"
            EXT=""
            [ "$GOOS" = "windows" ] && EXT=".exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "-s -w" -o "dist/release-tool-${GOOS}-${GOARCH}${EXT}" .
          done

      - name: Create GitHub release
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          ARGS=("$TAG" --title "$TAG" --notes-file release-notes.md dist/*)
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          gh release create "${ARGS[@]}"
